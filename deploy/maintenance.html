<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 520px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #222;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            color: #555;
        }

        .contact {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .contact p {
            font-size: 0.9rem;
            color: #666;
        }

        .email {
            color: #2563eb;
            text-decoration: none;
        }

        .email:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div class="icon" aria-hidden="true">&#128736;</div>
        <h1>We'll Be Right Back</h1>
        <p>
            We're currently performing scheduled maintenance or a deployment.
            The service should be available again shortly.
        </p>
        <p>
            Please try refreshing this page in a few minutes.
        </p>
        <div class="contact">
            <p>
                If the issue persists, reach out to us at
                <a class="email" href="mailto:support@eurobureau.eu">support@eurobureau.eu</a>.
            </p>
        </div>
    </main>
</body>
</html>
