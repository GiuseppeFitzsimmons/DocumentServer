services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - documentserver

  portal:
    build: ../platform
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://portal:${DB_PASSWORD}@postgres:5432/portal
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      DS_URL: http://documentserver
      DS_JWT_SECRET: ${JWT_SECRET}
      TRUST_PROXY: "true"
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION}
      PLATFORM_BASE_URL: http://portal:3000
    depends_on:
      - postgres
      - redis

  documentserver:
    image: ghcr.io/euro-office/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      EXAMPLE_ENABLED: "true"
    # Not exposed to host — only reachable via caddy on the docker network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /mnt/pg-data/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:
