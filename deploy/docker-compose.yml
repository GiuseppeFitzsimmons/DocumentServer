services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./geo-whitelist.txt:/etc/caddy/geo-whitelist.txt:ro
      - ./blocked.html:/etc/caddy/blocked.html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - documentserver

  portal:
    build: ../platform
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://portal:${DB_PASSWORD}@postgres:5432/portal
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      DS_URL: http://documentserver
      DS_JWT_SECRET: ${JWT_SECRET}
      TRUST_PROXY: "true"
      FILE_STORAGE_PATH: /data/files
      PLATFORM_BASE_URL: http://portal:3000
      MAIL_DOMAIN: ${MAIL_DOMAIN:-eurobureau.eu}
      DKIM_PRIVATE_KEY: ${DKIM_PRIVATE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OVH_S3_ENDPOINT: ${OVH_S3_ENDPOINT:-}
      OVH_S3_BUCKET: ${OVH_S3_BUCKET:-}
      OVH_S3_ACCESS_KEY: ${OVH_S3_ACCESS_KEY:-}
      OVH_S3_SECRET_KEY: ${OVH_S3_SECRET_KEY:-}
      OVH_S3_REGION: ${OVH_S3_REGION:-eu-west-par}
    volumes:
      - /mnt/euro-office-data/files:/data/files
      - ./data/disposable-domains.txt:/app/data/disposable-domains.txt:ro
    depends_on:
      - postgres
      - redis

  documentserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.documentserver
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      EXAMPLE_ENABLED: "true"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - /mnt/euro-office-data/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:
