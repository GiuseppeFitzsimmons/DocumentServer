# Multi-server deployment: app servers only (no postgres/redis)
# DB and Redis run on a dedicated server.
# Use: docker compose -f docker-compose.multi.yml up -d --build
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx-multi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portal
      - documentserver

  portal:
    build: ../platform
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DS_URL: ${DS_URL:-http://documentserver}
      DS_JWT_SECRET: ${JWT_SECRET}
      TRUST_PROXY: "true"
      STORAGE_BACKEND: s3
      FILE_STORAGE_PATH: /data/files
      PLATFORM_BASE_URL: ${PLATFORM_BASE_URL}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-eurobureau.eu}
      DKIM_PRIVATE_KEY: ${DKIM_PRIVATE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OVH_S3_ENDPOINT: ${OVH_S3_ENDPOINT}
      OVH_S3_BUCKET: ${OVH_S3_BUCKET}
      OVH_S3_ACCESS_KEY: ${OVH_S3_ACCESS_KEY}
      OVH_S3_SECRET_KEY: ${OVH_S3_SECRET_KEY}
      OVH_S3_REGION: ${OVH_S3_REGION:-eu-west-par}
    volumes:
      - ./data/disposable-domains.txt:/app/data/disposable-domains.txt:ro
      - ../fonts:/data/fonts:ro
      - ../core-fonts:/data/core-fonts:ro

  documentserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.documentserver
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      EXAMPLE_ENABLED: "true"
