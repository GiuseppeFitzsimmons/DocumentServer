# Prod proxy nginx configuration for eurobureau.eu
# Manages TLS (via certbot), geo-blocking, and routing to app backends

upstream app_backends {
    ip_hash;
    server 10.0.0.11:80;
    server 10.0.0.12:80;
}

# Geo-blocking: default blocked, whitelist allows
geo $geo_blocked {
    default 1;
    include /etc/nginx/geo-whitelist.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name eurobureau.eu www.eurobureau.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eurobureau.eu;

    ssl_certificate /etc/letsencrypt/live/eurobureau.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eurobureau.eu/privkey.pem;

    return 301 https://eurobureau.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eurobureau.eu;

    ssl_certificate /etc/letsencrypt/live/eurobureau.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eurobureau.eu/privkey.pem;

    # Geo-block check
    if ($geo_blocked) {
        return 403;
    }

    location / {
        proxy_pass http://app_backends;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }
}
