# Nginx reverse proxy configuration for eurobureau.eu
# Manages TLS termination, geo-blocking, and routing to backend services

# --- Upstream definitions ---
upstream portal_backend {
    server 10.0.1.2:3000;
}

upstream docserver_backend {
    server 10.0.1.2:80;
}

# --- Geo-blocking module ---
# Evaluates client IP against CIDR whitelist
# default 1 = blocked; entries in the whitelist file set 0 = allowed
geo $geo_blocked {
    default 1;
    include /etc/nginx/geo-whitelist.conf;
}

# --- HTTP server block: redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name eurobureau.eu www.eurobureau.eu;

    return 301 https://$host$request_uri;
}

# --- www redirect server block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.eurobureau.eu;

    ssl_certificate /etc/letsencrypt/live/eurobureau.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eurobureau.eu/privkey.pem;

    return 301 https://eurobureau.eu$request_uri;
}

# --- Main HTTPS server block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eurobureau.eu;

    ssl_certificate /etc/letsencrypt/live/eurobureau.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eurobureau.eu/privkey.pem;

    # Geo-block check: deny non-whitelisted IPs
    if ($geo_blocked) {
        return 403;
    }

    error_page 403 /blocked.html;
    location = /blocked.html {
        root /var/www/html;
        internal;
    }

    # --- DocumentServer location blocks ---
    location /web-apps/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /sdkjs/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /sdkjs-plugins/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /fonts/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /cache/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /coauthoring/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /doc/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /healthcheck {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /ConvertService.ashx {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /printfile/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- Versioned DocumentServer assets (e.g. /9.3.1-hash/web-apps/...) ---
    location ~ "^/\d+\.\d+\.\d+-" {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- Default: proxy to portal ---
    location / {
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
