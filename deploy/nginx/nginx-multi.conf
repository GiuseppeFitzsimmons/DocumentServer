upstream portal_backend {
    server portal:3000;
}

upstream docserver_backend {
    server documentserver:80;
}

server {
    listen 80;
    server_name _;

    # Custom service worker
    location ~ service_worker\.js$ {
        rewrite ^ /custom-sw.js break;
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-cache";
    }

    # Font manifest proxy
    location ~ ^/[0-9.]+-[a-f0-9]+/sdkjs/common/AllFonts\.js$ {
        rewrite ^ /api/fonts/AllFonts.js break;
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store";
    }

    # DocumentServer paths
    location /web-apps/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /sdkjs/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /sdkjs-plugins/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /fonts/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /cache/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /printfile/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /coauthoring/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /doc/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 10m;
    }

    location /healthcheck {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ConvertService.ashx {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Versioned DS assets
    location ~ "^/\d+\.\d+\.\d+-" {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 10m;
    }

    # Everything else goes to the platform
    location / {
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 2m;
        proxy_read_timeout 300s;
    }
}
