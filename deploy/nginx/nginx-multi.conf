# Multi-server app nginx: routes / to the platform (portal) and DocumentServer
# asset/API paths to documentserver.
#
# IMPORTANT — upstreams are resolved PER REQUEST via Docker's embedded DNS
# (127.0.0.11), NOT cached at startup. This avoids a class of bug where, after
# a redeploy, container IPs shuffle (Docker reuses freed IPs) and a long-lived
# nginx keeps a stale cached IP for "portal" that now belongs to
# "documentserver" — which made "/" serve the DS welcome page. Using a resolver
# + variables in proxy_pass forces nginx to re-resolve on every request, so it
# always tracks the current container IPs even if nginx itself isn't recreated.
#
# Mechanics: `set $var host; proxy_pass http://$var...;` — a variable in
# proxy_pass makes nginx use the resolver at request time instead of resolving
# the name once at config load. The `resolver` line points at Docker's internal
# DNS. `valid=10s` caps how long a resolution is cached.

server {
    listen 80;
    server_name _;

    # Docker embedded DNS; short TTL so IP changes are picked up quickly.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream targets as variables (re-resolved per request via the resolver).
    set $portal_upstream       "portal:3000";
    set $docserver_upstream    "documentserver:80";

    # Custom service worker
    location ~ service_worker\.js$ {
        rewrite ^ /custom-sw.js break;
        proxy_pass http://$portal_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header Cache-Control "no-cache";
    }

    # Font manifest proxy
    location ~ ^/[0-9.]+-[a-f0-9]+/sdkjs/common/AllFonts\.js$ {
        rewrite ^ /api/fonts/AllFonts.js break;
        proxy_pass http://$portal_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store";
    }

    # DocumentServer paths.
    # NOTE: with a variable in proxy_pass, nginx does NOT auto-append the
    # request URI, so we pass $request_uri explicitly on every non-rewrite
    # location to preserve the original path + query.
    location /web-apps/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /sdkjs/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /sdkjs-plugins/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /fonts/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # PDF files from /cache/ go through portal for Ghostscript cleaning
    location ~ ^/cache/.*\.pdf {
        proxy_pass http://$portal_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /cache/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /printfile/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /coauthoring/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /doc/ {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 10m;
    }

    location /healthcheck {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /ConvertService.ashx {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Versioned DS assets
    location ~ "^/\d+\.\d+\.\d+-" {
        proxy_pass http://$docserver_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 10m;
    }

    # Everything else goes to the platform
    location / {
        proxy_pass http://$portal_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 2m;
        proxy_read_timeout 300s;
    }
}
