#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - git

write_files:
  - path: /opt/euro-office/.env
    content: |
      JWT_SECRET=${jwt_secret}
      DB_PASSWORD=${db_password}
      SESSION_SECRET=${session_secret}
      DATABASE_URL=postgres://portal:${db_password}@${db_host}:5432/portal
      REDIS_URL=redis://${redis_host}:6379
      DS_URL=https://${domain}
      PLATFORM_BASE_URL=http://nginx:80
      STORAGE_BACKEND=s3
      OVH_S3_ENDPOINT=${s3_endpoint}
      OVH_S3_BUCKET=${s3_bucket}
      OVH_S3_ACCESS_KEY=${s3_access_key}
      OVH_S3_SECRET_KEY=${s3_secret_key}
      OVH_S3_REGION=${s3_region}
      SMTP_HOST=${smtp_host}
      SMTP_PORT=${smtp_port}
      SMTP_USER=${smtp_user}
      SMTP_PASS=${smtp_pass}
      MAIL_DOMAIN=eurobureau.eu
      NODE_ENV=production
      TRUST_PROXY=true

runcmd:
  # Install Docker from official repo
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # Ensure private network interface is configured
  - |
    if ! grep -q "enp7s0" /etc/netplan/50-cloud-init.yaml 2>/dev/null; then
      cat >> /etc/netplan/50-cloud-init.yaml <<EOF
        enp7s0:
          dhcp4: true
    EOF
      netplan apply
    fi

  # Clone repo and deploy
  - mkdir -p /opt/euro-office
  - git clone ${repo_url} /opt/euro-office/repo
  - cd /opt/euro-office/repo && git submodule update --init fonts
  - ln -sf /opt/euro-office/.env /opt/euro-office/repo/deploy/.env
  - cd /opt/euro-office/repo/deploy && docker compose -f docker-compose.multi.yml down 2>/dev/null; docker compose -f docker-compose.multi.yml up -d --build
  - sleep 10
  - cd /opt/euro-office/repo/deploy && docker compose -f docker-compose.multi.yml exec -T portal node dist/db/migrate.js || true

  # Nightly backup email cron (runs at 00:05 UTC daily)
  - |
    echo '5 0 * * * root cd /opt/euro-office/repo/deploy && docker compose -f docker-compose.multi.yml exec -T portal node dist/jobs/nightly-backup.js >> /var/log/euro-office-nightly-backup.log 2>&1' > /etc/cron.d/euro-office-nightly-backup
    chmod 644 /etc/cron.d/euro-office-nightly-backup
