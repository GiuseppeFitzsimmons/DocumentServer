#cloud-config

apt:
  sources:
    universe:
      source: "deb http://archive.ubuntu.com/ubuntu $RELEASE universe"

package_update: true
package_upgrade: true

packages:
  - nginx
  - certbot
  - python3-certbot-nginx

write_files:
  - path: /etc/nginx/sites-available/eurobureau.conf
    permissions: "0644"
    encoding: b64
    content: ${nginx_config_b64}

  - path: /opt/refresh-cidrs-nginx.sh
    permissions: "0755"
    encoding: b64
    content: ${refresh_cidrs_b64}

  - path: /var/www/html/blocked.html
    permissions: "0644"
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Access Denied</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f5f5f5; color: #333; }
          .container { text-align: center; padding: 2rem; max-width: 500px; }
          h1 { font-size: 2rem; margin-bottom: 1rem; }
          p { font-size: 1.1rem; line-height: 1.6; color: #666; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>Access Denied</h1>
          <p>This service is not available in your country. Access is restricted based on geographic location.</p>
        </div>
      </body>
      </html>

  - path: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      nginx -s reload

  - path: /opt/bootstrap-nginx.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail

      DOMAIN="${proxy_domain}"

      # Step 1: Create empty geo-whitelist so nginx can parse config
      touch /etc/nginx/geo-whitelist.conf

      # Step 2: Deploy HTTP-only bootstrap config (no SSL references)
      cat > /etc/nginx/sites-available/bootstrap.conf <<'EOF'
      server {
          listen 80;
          listen [::]:80;
          server_name ${proxy_domain} www.${proxy_domain};

          location / {
              return 200 "waiting for TLS setup";
              add_header Content-Type text/plain;
          }
      }
      EOF

      # Step 3: Activate bootstrap config
      rm -f /etc/nginx/sites-enabled/default
      rm -f /etc/nginx/sites-enabled/eurobureau.conf
      ln -sf /etc/nginx/sites-available/bootstrap.conf /etc/nginx/sites-enabled/bootstrap.conf
      nginx -t && systemctl restart nginx

      # Step 4: Run CIDR refresh to populate geo-whitelist
      bash /opt/refresh-cidrs-nginx.sh || true

      # Step 5: Obtain TLS certificate (certbot uses port 80 challenge)
      certbot certonly --nginx -d "$DOMAIN" -d "www.$DOMAIN" --non-interactive --agree-tos -m "admin@$DOMAIN"

      # Step 6: Switch to full config with SSL
      rm -f /etc/nginx/sites-enabled/bootstrap.conf
      ln -sf /etc/nginx/sites-available/eurobureau.conf /etc/nginx/sites-enabled/eurobureau.conf
      nginx -t && systemctl restart nginx

      # Step 7: Cleanup
      rm -f /etc/nginx/sites-available/bootstrap.conf

runcmd:
  - bash /opt/bootstrap-nginx.sh
  - echo '0 3 * * 0 root /opt/refresh-cidrs-nginx.sh >> /var/log/cidrs-refresh.log 2>&1' > /etc/cron.d/cidrs-refresh
  - chmod 644 /etc/cron.d/cidrs-refresh
