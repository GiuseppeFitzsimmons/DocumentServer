#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

write_files:
  - path: /opt/euro-office/.env
    permissions: "0600"
    content: |
      JWT_SECRET=${jwt_secret}
      DB_PASSWORD=${db_password}
      SESSION_SECRET=${session_secret}
      S3_ENDPOINT=${s3_endpoint}
      S3_BUCKET=${s3_bucket}
      S3_ACCESS_KEY_ID=${s3_access_key_id}
      S3_SECRET_ACCESS_KEY=${s3_secret_access_key}
      S3_REGION=${s3_region}

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Wait for the Hetzner volume to be mounted (automount via hcloud agent)
  - |
    echo "Waiting for Hetzner volume mount..."
    for i in $(seq 1 30); do
      VOLUME_MOUNT=$(find /mnt -maxdepth 1 -name "HC_Volume_*" -type d 2>/dev/null | head -1)
      if [ -n "$VOLUME_MOUNT" ] && mountpoint -q "$VOLUME_MOUNT"; then
        break
      fi
      sleep 5
    done
    if [ -z "$VOLUME_MOUNT" ]; then
      echo "ERROR: Hetzner volume not found after 150s, falling back to local storage"
      mkdir -p /mnt/pg-data/postgresql
    else
      echo "Found volume at $VOLUME_MOUNT"
      ln -sfn "$VOLUME_MOUNT" /mnt/pg-data
      mkdir -p /mnt/pg-data/postgresql
    fi
    chown -R 999:999 /mnt/pg-data/postgresql

  # Clone the repo
  - git clone ${repo_url} /opt/euro-office/repo

  # Copy env file into deploy directory and start the stack
  - |
    cp /opt/euro-office/.env /opt/euro-office/repo/deploy/.env
    cd /opt/euro-office/repo/deploy && docker compose up -d --build
