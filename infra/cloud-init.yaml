#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release

write_files:
  - path: /opt/euro-office/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        documentserver:
          image: ghcr.io/euro-office/documentserver:latest
          restart: unless-stopped
          ports:
            - "80:80"
          environment:
            - JWT_SECRET=${jwt_secret}
            - EXAMPLE_ENABLED=true

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Start the stack
  - cd /opt/euro-office && docker compose up -d
