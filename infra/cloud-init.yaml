#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

write_files:
  - path: /opt/euro-office/.env
    permissions: "0600"
    content: |
      JWT_SECRET=${jwt_secret}
      DB_PASSWORD=${db_password}
      SESSION_SECRET=${session_secret}
      MAIL_DOMAIN=${mail_domain}
      DKIM_PRIVATE_KEY="${dkim_private_key}"
      SMTP_HOST=${smtp_host}
      SMTP_PORT=${smtp_port}
      SMTP_USER=${smtp_user}
      SMTP_PASS=${smtp_pass}

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Mount the persistent volume
  # Hetzner automounts to /mnt/HC_Volume_*, wait for it
  - |
    echo "Waiting for Hetzner volume..."
    for i in $(seq 1 30); do
      VOLUME_MOUNT=$(find /mnt -maxdepth 1 -name "HC_Volume_*" -type d 2>/dev/null | head -1)
      if [ -n "$VOLUME_MOUNT" ] && mountpoint -q "$VOLUME_MOUNT"; then
        break
      fi
      sleep 5
    done
    if [ -z "$VOLUME_MOUNT" ]; then
      echo "ERROR: Volume not found, using local storage"
      mkdir -p /mnt/euro-office-data
    else
      echo "Found volume at $VOLUME_MOUNT"
      ln -sfn "$VOLUME_MOUNT" /mnt/euro-office-data
    fi
    mkdir -p /mnt/euro-office-data/postgresql
    mkdir -p /mnt/euro-office-data/files
    chown -R 999:999 /mnt/euro-office-data/postgresql

  # Clone the repo
  - git clone ${repo_url} /opt/euro-office/repo

  # Copy env file into deploy directory and start the stack
  - |
    cp /opt/euro-office/.env /opt/euro-office/repo/deploy/.env
    cd /opt/euro-office/repo/deploy && docker compose up -d --build
