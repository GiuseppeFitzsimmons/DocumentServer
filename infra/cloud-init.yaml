#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

write_files:
  - path: /opt/euro-office/.env
    permissions: "0600"
    content: |
      JWT_SECRET=${jwt_secret}
      DB_PASSWORD=${db_password}
      SESSION_SECRET=${session_secret}
      MAIL_DOMAIN=${mail_domain}
      RESEND_API_KEY=${resend_api_key}
      DKIM_PRIVATE_KEY="${dkim_private_key}"
      SMTP_HOST=${smtp_host}
      SMTP_PORT=${smtp_port}
      SMTP_USER=${smtp_user}
      SMTP_PASS=${smtp_pass}
      OVH_S3_ENDPOINT=${ovh_s3_endpoint}
      OVH_S3_BUCKET=${ovh_s3_bucket}
      OVH_S3_ACCESS_KEY=${ovh_s3_access_key}
      OVH_S3_SECRET_KEY=${ovh_s3_secret_key}
      OVH_S3_REGION=${ovh_s3_region}

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Mount the persistent volume
  # Hetzner automounts to /mnt/HC_Volume_*, wait for it
  - |
    echo "Waiting for Hetzner volume..."
    for i in $(seq 1 30); do
      VOLUME_MOUNT=$(find /mnt -maxdepth 1 -name "HC_Volume_*" -type d 2>/dev/null | head -1)
      if [ -n "$VOLUME_MOUNT" ] && mountpoint -q "$VOLUME_MOUNT"; then
        break
      fi
      sleep 5
    done
    if [ -z "$VOLUME_MOUNT" ]; then
      echo "ERROR: Volume not found, using local storage"
      mkdir -p /mnt/euro-office-data
    else
      echo "Found volume at $VOLUME_MOUNT"
      ln -sfn "$VOLUME_MOUNT" /mnt/euro-office-data
    fi
    mkdir -p /mnt/euro-office-data/postgresql
    mkdir -p /mnt/euro-office-data/files
    chown -R 999:999 /mnt/euro-office-data/postgresql

  # Clone the repo
  - git clone ${repo_url} /opt/euro-office/repo

  # Copy env file into deploy directory and start the stack
  - |
    cp /opt/euro-office/.env /opt/euro-office/repo/deploy/.env
    cd /opt/euro-office/repo/deploy && docker compose up -d --build

  # Install AWS CLI for replication
  - |
    curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
    unzip -q /tmp/awscliv2.zip -d /tmp/aws-install
    /tmp/aws-install/aws/install
    rm -rf /tmp/awscliv2.zip /tmp/aws-install

  # Set up daily replication cron (runs at 03:00 UTC)
  - |
    echo '0 3 * * * root /opt/euro-office/repo/deploy/replicate.sh >> /var/log/euro-office-replication.log 2>&1' > /etc/cron.d/euro-office-replication
    chmod 644 /etc/cron.d/euro-office-replication

  # Set up weekly DoS protection cron jobs (runs Sunday early morning UTC)
  - |
    printf '%s\n' \
      '0 4 * * 0 root /opt/euro-office/repo/deploy/scripts/refresh-cidrs.sh >> /var/log/euro-office-dos-protection.log 2>&1' \
      '30 4 * * 0 root /opt/euro-office/repo/deploy/scripts/refresh-disposable-emails.sh >> /var/log/euro-office-dos-protection.log 2>&1' \
      > /etc/cron.d/euro-office-dos-protection
    chmod 644 /etc/cron.d/euro-office-dos-protection

  # Run initial DoS protection data fetch during provisioning
  - /opt/euro-office/repo/deploy/scripts/refresh-cidrs.sh >> /var/log/euro-office-dos-protection.log 2>&1
  - /opt/euro-office/repo/deploy/scripts/refresh-disposable-emails.sh >> /var/log/euro-office-dos-protection.log 2>&1

  # Set up nightly backup email cron (runs at 00:05 UTC daily)
  - |
    echo '5 0 * * * root docker compose -f /opt/euro-office/repo/deploy/docker-compose.yml exec -T portal node dist/jobs/nightly-backup.js >> /var/log/euro-office-nightly-backup.log 2>&1' > /etc/cron.d/euro-office-nightly-backup
    chmod 644 /etc/cron.d/euro-office-nightly-backup
