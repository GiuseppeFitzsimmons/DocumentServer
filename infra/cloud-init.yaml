#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

write_files:
  - path: /opt/euro-office/.env
    permissions: "0600"
    content: |
      JWT_SECRET=${jwt_secret}
      DB_PASSWORD=${db_password}
      SESSION_SECRET=${session_secret}
      S3_ENDPOINT=${s3_endpoint}
      S3_BUCKET=${s3_bucket}
      S3_ACCESS_KEY_ID=${s3_access_key_id}
      S3_SECRET_ACCESS_KEY=${s3_secret_access_key}
      S3_REGION=${s3_region}

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Clone the repo
  - git clone ${repo_url} /opt/euro-office/repo

  # Copy env file into deploy directory and start the stack
  - |
    cp /opt/euro-office/.env /opt/euro-office/repo/deploy/.env
    cd /opt/euro-office/repo/deploy && docker compose up -d --build
