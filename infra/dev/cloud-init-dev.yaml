#cloud-config

ssh_authorized_keys:
  - ${ssh_public_key}

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - nginx
  - certbot
  - python3-certbot-nginx

write_files:
  - path: /etc/nginx/sites-available/dev.conf
    permissions: "0644"
    content: |
      upstream portal_backend {
          server 127.0.0.1:3000;
      }
      upstream docserver_backend {
          server 127.0.0.1:8080;
      }
      server {
          listen 80;
          server_name ${dev_domain};

          location /web-apps/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location /sdkjs/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location /sdkjs-plugins/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location /fonts/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location /cache/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location /coauthoring/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }
          location /doc/ {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              client_max_body_size 2m;
          }
          location /healthcheck {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location /ConvertService.ashx {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
          }
          location ~ "^/\d+\.\d+\.\d+-" {
              proxy_pass http://docserver_backend;
              proxy_set_header Host $http_host;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              client_max_body_size 2m;
          }
          location / {
              proxy_pass http://portal_backend;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header Cookie $http_cookie;
          }
      }

  - path: /etc/nginx/sites-available/dev.conf
    permissions: "0644"
    content: |
      # Placeholder — replaced from repo after clone

runcmd:
  # Install Docker
  - curl -fsSL https://get.docker.com | sh

  # Configure nginx
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/dev.conf /etc/nginx/sites-enabled/dev.conf
  - systemctl restart nginx

  # TLS certificate
  - certbot --nginx -d ${dev_domain} --non-interactive --agree-tos -m admin@eurobureau.eu

  # Mount the persistent volume
  - |
    echo "Waiting for Hetzner volume..."
    for i in $(seq 1 30); do
      VOLUME_MOUNT=$(find /mnt -maxdepth 1 -name "HC_Volume_*" -type d 2>/dev/null | head -1)
      if [ -n "$VOLUME_MOUNT" ] && mountpoint -q "$VOLUME_MOUNT"; then
        break
      fi
      sleep 5
    done
    if [ -z "$VOLUME_MOUNT" ]; then
      echo "ERROR: Volume not found, using local storage"
      mkdir -p /mnt/euro-office-data
    else
      echo "Found volume at $VOLUME_MOUNT"
      ln -sfn "$VOLUME_MOUNT" /mnt/euro-office-data
    fi
    mkdir -p /mnt/euro-office-data/postgresql
    mkdir -p /mnt/euro-office-data/files
    chown -R 999:999 /mnt/euro-office-data/postgresql

  # Clone the repo
  - git clone ${repo_url} /opt/euro-office/repo
  - cd /opt/euro-office/repo && git submodule update --init fonts

  # Deploy nginx config from repo and restart
  - cp /opt/euro-office/repo/deploy/nginx/nginx-dev.conf /etc/nginx/sites-available/dev.conf
  - systemctl restart nginx

  # Create data directories (symlinked from volume)
  # Volume is already mounted at /mnt/euro-office-data

  # Write the .env file
  - |
    cat > /opt/euro-office/repo/deploy/.env <<EOF
    JWT_SECRET=${jwt_secret}
    DB_PASSWORD=${db_password}
    SESSION_SECRET=${session_secret}
    MAIL_DOMAIN=dev.eurobureau.eu
    RESEND_API_KEY=
    DKIM_PRIVATE_KEY=
    SMTP_HOST=
    SMTP_PORT=587
    SMTP_USER=
    SMTP_PASS=
    OVH_S3_ENDPOINT=
    OVH_S3_BUCKET=
    OVH_S3_ACCESS_KEY=
    OVH_S3_SECRET_KEY=
    OVH_S3_REGION=eu-west-par
    EOF

  # Start the stack
  - cd /opt/euro-office/repo/deploy && docker compose up -d --build
