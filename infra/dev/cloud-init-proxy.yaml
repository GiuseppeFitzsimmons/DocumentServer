#cloud-config
package_update: true
packages:
  - nginx
  - certbot
  - python3-certbot-nginx

write_files:
  - path: /etc/nginx/sites-available/dev.conf
    content: |
      upstream app_backends {
          ip_hash;
          server ${app_a_ip}:80;
          server ${app_b_ip}:80;
      }

      server {
          listen 80;
          server_name ${dev_domain};

          location / {
              proxy_pass http://app_backends;
              proxy_set_header Host $http_host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_connect_timeout 5s;
              proxy_read_timeout 60s;
              client_max_body_size 10m;
          }
      }

runcmd:
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/dev.conf /etc/nginx/sites-enabled/dev.conf
  - nginx -t && systemctl reload nginx
  - certbot --nginx -d ${dev_domain} --non-interactive --agree-tos -m admin@eurobureau.eu
