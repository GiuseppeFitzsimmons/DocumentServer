services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - documentserver
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  documentserver:
    image: ghcr.io/euro-office/documentserver:latest
    ports:
      - "8080:80"
    environment:
      JWT_SECRET: euro-office-dev-jwt-secret-key-2026
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      EXAMPLE_ENABLED: "true"
      GENERATE_FONTS: "true"
    volumes:
      - ../fonts:/var/www/euro-office/documentserver/core-fonts/custom
      - ../deploy/patches/documenteditor-app.js:/var/www/euro-office/documentserver/web-apps/apps/documenteditor/main/app.js:ro
      - ../deploy/plugins/_sdk/v1:/var/www/euro-office/documentserver/sdkjs-plugins/v1:ro
      - ../plugins/email-to-me:/var/www/euro-office/documentserver/sdkjs-plugins/asc.{B5C5E3D0-7F2A-4E91-9C12-EUROBUREAU001}:ro

volumes:
  pg_data:
