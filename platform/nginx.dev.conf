upstream portal_backend {
    server host.docker.internal:3000;
}

upstream docserver_backend {
    server documentserver:80;
}

server {
    listen 80;
    server_name localhost;

    # Font manifest proxy (filtered by platform)
    location ~ "^/[\d.]+-[a-f0-9]+/sdkjs/common/AllFonts\.js$" {
        rewrite ^ /api/fonts/AllFonts.js break;
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # DocumentServer paths
    location /web-apps/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    location /sdkjs/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    location /sdkjs-plugins/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    location /fonts/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    location /cache/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    location /coauthoring/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /doc/ {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 2m;
    }

    location /healthcheck {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    location /ConvertService.ashx {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
    }

    # Versioned DS assets
    location ~ "^/\d+\.\d+\.\d+-" {
        proxy_pass http://docserver_backend;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 2m;
    }

    # Everything else goes to the platform
    location / {
        proxy_pass http://portal_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
}
